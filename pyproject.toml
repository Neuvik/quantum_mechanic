[project]
name = "quantum-mechanic"
version = "1.0rc3"
description = "Offensive security assessment framework"
keywords = ["cloud-security", "offensive-security", "aws", "azure", "entra", "gcp", "oci"]
authors = [
    { name = "Moses Frost", email = "moses@neuvik.com" },
]
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "boto3>=1.35.0",
    "azure-identity>=1.19.0",
    "azure-mgmt-resource>=23.2.0",
    "azure-mgmt-subscription>=3.1.0",
    "google-auth>=2.38.0",
    "google-api-python-client>=2.160.0",
    "google-cloud-resource-manager>=1.14.0",
    "google-cloud-iam>=2.16.0",
    "google-cloud-kms>=3.5.1",
    "google-cloud-secret-manager>=2.24.0",
    "oci>=2.145.0",
    "prompt-toolkit>=3.0.50",
    "cryptography>=44.0.0",
    "fastapi[all]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "defusedxml>=0.7.1",
    "urllib3>=2.0.0",
    "rich>=14.0.0",
    "azure-mgmt-authorization>=4.0.0",
    "azure-mgmt-compute>=30.0.0",
    "azure-mgmt-network>=25.0.0",
    "azure-mgmt-web>=7.0.0",
    "azure-mgmt-keyvault>=10.3.0",
    "azure-keyvault-secrets>=4.9.0",
    "azure-mgmt-storage>=21.2.1",
    "azure-storage-blob>=12.24.1",
    "websocket-client>=1.8.0",  # Entra browser-CDP import support
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
    "jinja2>=3.1.6",
    "sse-starlette>=3.3.2",
    "itsdangerous>=2.2.0",
    "msgpack>=1.1.2",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/Neuvik/quantum_mechanic"
Repository = "https://github.com/Neuvik/quantum_mechanic"
Issues = "https://github.com/Neuvik/quantum_mechanic/issues"
Company = "https://neuvik.com"

[project.optional-dependencies]
agent = [
    "langchain>=1.2.10",
    "chromadb>=1.5.2",
    "langchain-anthropic>=1.3.4",
    "langchain-community>=0.4.1",
    "sentence-transformers>=5.2.3",
]
postgres = [
    "psycopg2-binary>=2.9",
]


[project.scripts]
qm  = "quantum_mechanic.__main__:main"
qmd = "quantum_mechanic.daemon.__main__:main"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "pexpect>=4.9.0",
    "grpcio-tools>=1.62.0",
    "bandit>=1.9.4",
    "vulture>=2.15",
    "radon>=6.0.1",
    "interrogate>=1.7.0",
    "vcrpy>=6.0.0",
    "pytest-recording>=0.13.1",
    "pip-audit>=2.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# .agents/ is vendored Claude Code skill/agent content, not QM product
# code — not maintained to product lint standards, churns on every skill
# sync. Excluded from linting; still covered by check-public-boundary.py
# and the domain-hygiene scan, which matter regardless of code style.
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]  # Allow security warnings in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "integration: shell integration tests using pexpect (real qm binary)",
    "smoke: canary tests against live provider APIs, no infra provisioning",
    "e2e: terraform-sandbox end-to-end tests — provisions real cloud infra",
    "chaos: chaos_e2e scenario tests — provisions real cloud infra via terraform",
]

[tool.coverage.run]
source = ["src/quantum_mechanic"]
omit = ["*/migrations/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = true
fail-under = 65
exclude = ["tests", "docs"]
verbose = 0

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Allow assert — same as ruff S101

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
