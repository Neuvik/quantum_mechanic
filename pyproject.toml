[project]
name = "quantum-mechanic"
version = "0.1.0"
description = "Offensive security assessment framework"
authors = [
    { name = "Moses Frost", email = "moses@neuvik.com" },
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    "boto3>=1.35.0",
    "azure-identity>=1.19.0",
    "azure-mgmt-resource>=23.2.0",
    "azure-mgmt-subscription>=3.1.0",
    "google-auth>=2.38.0",
    "google-cloud-resource-manager>=1.14.0",
    "oci>=2.145.0",
    "prompt-toolkit>=3.0.50",
    "cryptography>=44.0.0",
    "fastapi[all]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "rich>=14.0.0",
    "azure-mgmt-authorization>=4.0.0",
    "azure-mgmt-compute>=30.0.0",
    "langchain>=1.2.10",
    "chromadb>=1.5.2",
    "langchain-anthropic>=1.3.4",
    "langchain-community>=0.4.1",
    "sentence-transformers>=5.2.3",
    "websocket-client>=1.8.0",  # FortiOS CVE-2024-55591 exploit mode (jsconsole WS bypass)
    "grpcio>=1.62.0",
    "protobuf>=4.25.0",
    "jinja2>=3.1.6",
    "sse-starlette>=3.3.2",
    "itsdangerous>=2.2.0",
    "msgpack>=1.1.2",
]

[project.scripts]
qm  = "quantum_mechanic.__main__:main"
qmd = "quantum_mechanic.daemon.__main__:main"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
    "pexpect>=4.9.0",
    "grpcio-tools>=1.62.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]  # Allow security warnings in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: shell integration tests using pexpect (real qm binary)",
]

[tool.coverage.run]
source = ["src/quantum_mechanic"]
omit = ["*/migrations/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
